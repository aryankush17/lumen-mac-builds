name: Build Mac installer
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Mac processor (Apple Silicon or Intel)
        type: choice
        required: true
        default: apple-silicon
        options:
          - apple-silicon
          - intel
permissions:
  contents: read
concurrency:
  group: mac-installer-${{ inputs.architecture }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ${{ inputs.architecture == 'intel' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 45
    steps:
      - name: Check out clean source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up native Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build app and DMG
        shell: bash
        run: |
          set -o pipefail
          python -u mac_build.py 2>&1 | tee mac-build.log
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-build-log-${{ inputs.architecture }}
          path: mac-build.log
          retention-days: 3
      - name: Save installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Lumen-macOS-${{ inputs.architecture }}
          path: Output/*.dmg*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
